<!DOCTYPE html>
<html lang='ko'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>float 가로배치 하기</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .parent {
            border: 5px solid red;
            width: 600px;
            height: 400px;
            /* overflow의 hidden을 지정하면 부모높이 보다
                자식의 높이가 넘쳐 화면에 숨기고 싶을때
            */
            overflow: hidden;
            font-size: 15px;
            margin: auto;
            text-align: center;
        }

        .child {
            /* font-size: inherit; /* 부모의 글꼴 크기를 상속받음 */
            background-color: gold;
            width: 200px;
            height: 400px;
            /* float의 left로 왼쪽 정렬을 하려고 한다.
                자식에 float을 지정하면 부모는 자식이 없다고 여겨서
                자식의 높이 값을 잃는다는 점 주의!
            */
            /* float:left;             */
            display: inline-block;
            /* display: block; */
            /* block 요소에만 margin에 auto를 사용할수 있다. */
            margin: auto;
        }

        .parent02 {
            border: 5px solid red;
            width: 600px;
        }

        .top {
            background-color: purple;
            height: 50px;
        }

        .left {
            background-color: skyblue;
            height: 100px;
            width: 200px;
            float: left;
        }

        .rigth {
            background-color: orange;
            height: 100px;
            width: 400px;
            float: right;
        }

        .clear {
            background-color: purple;
            height: 50px;
            clear: both;
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="child">child</div>
    </div>

    <hr />

    <div class="parent02">
        <div class="top">float:none</div>
        <div class="left">float:left</div>
        <div class="right">float:right</div>
        <div class="clear">float:clear</div>
    </div>

    <header>
        
    </header>

</body>

</html>
