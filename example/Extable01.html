<!DOCTYPE html>
<html lang='ko'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>  
    <style>
                /*  <td rowspan="3">인터넷 최대 100M</td>CSS 작성방법 3가지
            1. 태그이름을 이용한 CSS
            2. class명을 이용한 CSS
            3. id명을 이용한 css            
        */
        body {
            /* 글꼴의 크기를 지정하는 CSS 명령어 */
            font-size: 14px;
        }
        table {
            /* 테이블의 가로 크기를 지정하는 CSS */
            width: auto;
            /* 셀 사이의 간격을 없애고 테두리 합치는 CSS */
            border-collapse: collapse;            
            /* 선그리기: 선사이즈, 실선, 검정색 */
            /* border: 1px solid black; */
        }
        /* 공통으로 CSS해야할 경우는 th, td형식으로 ,(콤마)로 나열한다. */
        thead th
        , tbody td {
            border : 1px solid  #555;
            /* 테이블안의 문자를 가운데 정렬하는 CSS */
            text-align: center;
            /* 표안의 한 줄 안의 여백을 주고싶을 때 사용하는 CSS */
            /* padding :5px(위, 아래, 오른쪽, 왼쪽에 여백을 줌) */
            padding: 7px;
        }
        thead th {
            /* th부분에 배경색을 지정하는 CSS */
            background-color: green;
            /* 글꼴색 CSS */
            color:  white;
        }
        caption {
            text-align: right;
            /* 텍스트의 바깥쪽 여백을 지정하는 CSS */
            /* margin: 5px(위, 아래, 오른쪽, 왼쪽) */
            /* margin-bottom: 10px(아래쪽만 여백지정) */
            margin-bottom: 10px;
        }
    </style>  
</head>
<body>
    <table>
        <caption>
            (본사 정식 소비자 가격)
        </caption>
        <thead>            
            <tr>
                <th colspan="2">제품명</th>
                
                <th>★★★★★★★<br/>바텍스</th>
                <th>★★★★★<br/>래티튜드</th>
                <th>★★★★<br/>아티젠IB</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">국내차량</td>
                <td>썬루프</td>
                <td>150,000</td>
                <td>90,000</td>
                <td>170,000</td>
            </tr>
            <tr>
                
                <td>파노라마 썬루프</td>
                <td>330,000</td>
                <td>200,000</td>
                <td>170,000</td>
            </tr>
            <tr>
                <td rowspan="2">수입차량</td>
                <td>썬루프</td>
                <td>180,000</td>
                <td>110,000</td>
                <td>90,000</td>
            </tr>
            <tr>
                
                <td>파노라마 썬루프</td>
                <td>350,000</td>
                <td>240,000</td>
                <td>200,000</td>
            </tr>
        </tbody>
    </table>


</body>
</html>
