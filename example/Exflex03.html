<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            height: 100%;
        }
        /* 화면 정중앙에 위치 */
        body {
            display: flex;
            /* 가로 가운데 */
            justify-content: center;
            /* 세로 가운데 */
            /* body안의 자식은 login-box 하나이므로
                align-items 이용하여 세로 가운데 위치한다.
            */
            align-items: center;
            font-family: sans-serif;
            background-color: lightgray;
            height: 100%;
        }
        .login-box {
            background-color: white;
            text-align: center;
            /*align-items: center;*/
            width: 300px;
            /*margin: 50px auto;*/
            padding: 10px;
            border-radius: 10px;
        }
        .login-box .btn {
            width: 250px;
            height: 25px;
            margin: 10px;
            background-color: #ea6153;
            border: none;
            border-radius: 15px;
        }
        .login-box .btn:hover {
            cursor: pointer;
        }
        .login-box h2{
            margin: 10px;
        }
        input{
            margin: 10px;
            width: 250px;
            height: 25px;
        }

    </style>
</head>
<body>
    <div class="login-box">
        <h2>Login</h2>
        <label>
            <input type="text" placeholder="아이디 입력" name="user_id" />
        </label>
        <label>
            <input type="password" placeholder="비밀번호 입력" name="user_pw" />
        </label>
        <button class="btn">로그인</button>
    </div>
</body>
</html>
