<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>연습상품5</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            height: 100%;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }
        .product-container{
            display: flex;
            padding-top: 10px;
            width: 1000px;
        }
        .product {
            border: none;
            margin: 5px;
        }
        img {
            border-radius: 10px;
        }
        .product-title {
            font-size: 14px;
            height: 40px;
        }
        .product-price {
            font-size:13px;
        }
        .product-price .price {
            text-decoration: line-through;
        }
        .discount-price {
            font-weight: bold;
        }
        .discount-info .percent {
            color: red;
        }
    </style>
</head>
<body>
    <div class="product-container">

        <div class="product">
            <div class="product-img">
                <img src="../images/sale01.jpg" alt="product1">
            </div>
            <div class="product-title">
                아이와 함께 취침하기 다용도 개별 막
            </div>
            <div class="product-price">
                <div class="price"><span>54,500원</span></div>
                <div class="discount-info">
                    <span class="percent">18%</span><span class="discount-price"> 44,000원</span>
                </div>
            </div>
        </div>

        <div class="product">
            <div class="product-img">
                <img src="../images/sale02.jpg" alt="product2">
            </div>
            <div class="product-title">
                20살은 젊어 보이는 가성비 갑 달바 세럼
            </div>
            <div class="product-price">
                <div class="price"><span>54,500원</span></div>
                <div class="discount-info">
                    <span class="percent">18%</span><span class="discount-price">44,000원</span>
                </div>
            </div>
        </div>

        <div class="product">
            <div class="product-img">
                <img src="../images/sale03.jpg" alt="product3">
            </div>
            <div class="product-title">
                ++1등급 마장동 명품 투뿔 한우 선물 세트 소고기 구이용 설 명절
            </div>
            <div class="product-price">
                <div class="price"><span>54,500원</span></div>
                <div class="discount-info">
                    <span class="percent">18%</span><span class="discount-price">44,000원</span>
                </div>
            </div>
        </div>

        <div class="product">
            <div class="product-img">
                <img src="../images/sale04.jpg" alt="product4">
            </div>
            <div class="product-title">
                고려은단 비타민C1000 요즘 성인건강에 필수인 비타민C1000
            </div>
            <div class="product-price">
                <div class="price"><span>54,500원</span></div>
                <div class="discount-info">
                    <span class="percent">18%</span><span class="discount-price">44,000원</span>
                </div>
            </div>
        </div>


    </div>
</body>
</html>
