<!DOCTYPE html>
<html lang='ko'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>폼태그 연습문제</title>    
    <style>
        body {
            /* 글꼴종류 선택하는 CSS */
            font-family: sans-serif;
            font-size: 14px;
        }
        h3 {
            /* 바깥쪽 아래여백을 20px로 지정하는 CSS */
            margin-bottom: 20px;
        }
        /* ul -> li 기호 제거 */
        ul {
            /* li의 기호 삭제하는 CSS */
            list-style: none;
            padding-left: 0;
            margin: 0;
        }
        ul li{
            margin-bottom: 10px;
        }
        textarea{
            width: 300px;
            height: 80px;
            margin-top: 5px;
        }
        label{
            /* 글꼴을 굵게 하는 css */
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>간단한 설문</h1>
    <form method="get" action="#">
        <!-- ul -> li 이용 : 순서가 없는 목록을 작성할 때 유효하다. -->
        <!-- 1. 좋아하는 과일 : select 태그 이용 -->
        <ul>
            <li>
                <label for="fruit">좋아하는 과일 선택:</label>
                <select id="fruit" name="fruit">
                    <option value="사과">사과</option>
                    <option value="바나나">바나나</option>
                    <option value="딸기">딸기</option>
                    <option value="포도">포도</option>
                </select>
            </li>
            <!-- 2. 좋아하는 음료 : datalist 이용
                - select 태그와 다른점은 사용자가 직접 입력할 수 있다.
                - 키보드로 입력하면 해당 글자가 들어간 항목만 필터링 된다.
                - <input>태그에 추천 옵션을 제공방식으로 작성한다.
                - <input list="ID">와 <datalist id="ID">함께 연동해서 사용한다.
              -->
            <li>
                <label for="drink">좋아하는 음료 입력:</label>
                <input type="text" id="drink" name="drink" list="drink-list" />
                <datalist id="drink-list">
                    <option value="콜라"></option>
                    <option value="사이다"></option>
                    <option value="쥬스"></option>
                    <option value="커피"></option>
                </datalist>
            </li>        
            <!--  3. 취미(복수 선택 가능) : checkbox 이용 -->
            <li>
                <label>취미(복수 선택 가능):</label>
                <label><input type="checkbox" name="hobby" value="독서">독서</label>
                <label><input type="checkbox" name="hobby" value="독서">운동</label>
                <label><input type="checkbox" name="hobby" value="독서">음악</label>
                <label><input type="checkbox" name="hobby" value="독서">여행</label>
            </li>  
            <!-- 4. 성별: radio 이용 -->
            <li>
                <label>성별 선택 : </label>
                <label><input type="radio" name="gender" value="남성" />남성</label>
                <label><input type="radio" name="gender" value="여성" />여성</label>
            </li>
            <!-- 5. 추가의견 : textarea -->
            <li>
                <label for="content">추가의견:</label><br/>
                <textarea id="content" name="comment" placeholder="의견을 입력하세요."></textarea>
            </li>
            <li>
                <input type="submit"></input>
            </li>
        </ul>

</body>
