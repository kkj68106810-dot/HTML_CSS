<!DOCTYPE html>
<html lang='ko'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>CSS 연습문제2</title>
    <style>
        .h1_wrap {
            width: 500px;
        }
        h1 {
            background-color: aqua;
            border-radius: 50px;
            box-shadow: 10px 10px 0 dodgerblue;
        }
        .title {
            color:blue;
            text-decoration: underline;
        }

    </style>
</head>

<body>
    <!-- ① <ul> 태그를 이용하여 다음의 <출력 결과물>과 같이 html 파일을 작성하시오.
    ② 'Best Coffee Beans of the World' 제목은 <h1> 태그를 이용하여 작성하시오. 
    ③ 각 <li> 태그의 'Ethiopia Yirgacheffe', 'Colombia Supremo', 'Guatemala Antigua'는 <span> 태그를 이용하
    여 작
    성하시오. 
    ④ 제목(<h1>) 박스에는 border-radius를 이용하여 모서리를 둥글게 처리하시오. 
    ⑤ 제목(<h1>) 박스에는 box-shadow를 이용하여 그림자 효과를 적용하시오. 
    (그림자 색상, 방향은 자유롭게 설정) 
    ⑥ CSS는 <출력 결과물>을 보고 알아서 작성하시오. 
    ⑧ 파일명은 Example_11.html로 작성하시오.
    ⑦ CSS 파일은 별도로 작성하지 말고 <head>...</head> 태그 안에 작성하시오.  -->
    <div class="h1_wrap">
        <h1>Best Coffee Beans of the World</h1>
    </div>
    <ul>
        <li>
            <span class="title">Ethiopia Yirgacheffe</span> : Known for its bright acidity and floral, citrus notes.
        </li>
        <li>
            <span class="title">Colombia Supremo</span> : Balanced flavor with a nutty, caramel sweetness.
        </li>
        <li>
            <span class="title">Guatemala Antigua</span> : Rich body with smoky, chocolate undertones.
        </li>
    </ul>
</body>

</html>
