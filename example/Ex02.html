<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>연습문제 02</title>

</head>
<body>
<!--① 아래 <출력 결과물>과 같이 자료를 입력하고 작성하시오.-->
<!--② 긴 인용문 구역에는 <blockquote> 태그를 적용하세요.-->
<!--③ 수학공식의 위 첨자(<sup>)와 화학식의 아래 첨자(<sub>)를 활용하여 𝑥2+𝑦2및 𝐻2𝑂를 표기하세요.-->
<!--④ 수정된 텍스트 표현을 위해 삭제선(<del>)과 추가선(<ins>)을 포함하세요.-->
<!--⑤ 파일명은 Ex02.html로 작성하시오.-->
    <h1>인용문 및 첨자/수정 태그 활용</h1>

    <blockquote>
        웹의 힘은 그것의 보편성에 있다. 장애에 상관없이 모든 사람이 접근할 수 있는 것이 필수적인 요소이다.
    </blockquote>
    <p>
        피타고라스 정리는 x<sup>2</sup>+y<sup>2</sup> = z<sup>2</sup> 공식으로 표현됩니다.
    <br />
        물 분자 기호는 H<sub>2</sub>O 입니다.
    </p>

    <p>
        이벤트 기간: <del>2026년 8월 31일</del> &rarr; <ins>2026년 9월 15일까지 연장</ins>
    </p>
</body>
</html>
