<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>연습문제2</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        .card-container{
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            width: 1000px;
        }
        .card-container .card{
            background-color: dodgerblue;
            width: 300px;
            padding: 10px;
            margin: auto;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            color: white;
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="card">
            <h3>Card 1</h3>
            <p>첫 번째 카드 설명입니다.</p>
        </div>
        <div class="card">
            <h3>Card 2</h3>
            <p>두 번째 카드 설명입니다.</p>
        </div>
        <div class="card">
            <h3>Card 3</h3>
            <p>세 번째 카드 설명입니다.</p>
        </div>
    </div>
</body>
</html>
