<!DOCTYPE html>
<html lang='ko'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <style>
        /*  <td rowspan="3">인터넷 최대 100M</td>CSS 작성방법 3가지
            1. 태그이름을 이용한 CSS
            2. class명을 이용한 CSS
            3. id명을 이용한 css            
        */
        body {
            /* 글꼴의 크기를 지정하는 CSS 명령어 */
            font-size: 14px;
        }
        table {
            /* 테이블의 가로 크기를 지정하는 CSS */
            width: auto;
            /* 셀 사이의 간격을 없애고 테두리 합치는 CSS */
            border-collapse: collapse;            
            /* 선그리기: 선사이즈, 실선, 검정색 */
            /* border: 1px solid black; */            
        }
        /* 공통으로 CSS해야할 경우는 th, td형식으로 ,(콤마)로 나열한다. */
        thead th
        , tbody td {
            border : 1px solid #ddd;
            /* 테이블안의 문자를 가운데 정렬하는 CSS */
            text-align: center;
            /* 표안의 한 줄 안의 여백을 주고싶을 때 사용하는 CSS */
            /* padding :5px(위, 아래, 오른쪽, 왼쪽에 여백을 줌) */
            padding: 7px;
        }
        thead th {
            /* th부분에 배경색을 지정하는 CSS */
            background-color: #ea6153;
            /* 글꼴색 CSS */
            color: #fff;
        }
        caption {
            text-align: right;
            /* 텍스트의 바깥쪽 여백을 지정하는 CSS */
            /* margin: 5px(위, 아래, 오른쪽, 왼쪽) */
            /* margin-bottom: 10px(아래쪽만 여백지정) */
            margin-bottom: 10px;
        }
        tfoot {
            background-color:  #333;
            color: white;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>방이름</th>
                <th>대상</th>
                <th>인실</th>
                <th>가격</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>유채방</td>
                <td>여성전용</td>
                <td rowspan="3">4인실</td>
                <td rowspan="3">1팀 30,000원</td>
            </tr>
            <tr>
                <td>동백방</td>
                <td>남성전용</td>
                
            </tr>
            <tr>
                <td>백합방</td>
                <td>커플전용</td>
                
            </tr>
            <tr>
                <td>튤립방</td>
                <td>가족전용</td>
                <td>4인실</td>
                <td>100,000원(4인기준 1팀당)</td>
            </tr>            
        </tbody>
        <tfoot>
            <tr>
                <td colspan="4">모든 준비된 재료가 포함된 바베큐장을 렌트해드립니다.(가격: <del>150,000</del> -> 100,000원/4인기준)</td>                
            </tr>
        </tfoot>
    </table>

</body>
</html>
