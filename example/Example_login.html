<!DOCTYPE html>
<html lang='ko'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel='stylesheet' href='../styleCss/style_login.css'>
</head>
<body>

    <div class="login-wrap">
        <h1>NAVER</h1>
        <div class="login-box">
            <div class="login-form-wrapper id-password">
                <div class="login-id">
                    <label for="user_id"></label>
                    <input type="text" placeholder="아이디 또는 전화번호" id="user_id" />
                </div>

                <div class="login-pwd">
                    <label for="password"></label>
                    <input type="text" placeholder="비밀번호" id="password" />
                </div>
            </div>

            <div class="login-form-wrapper remember-ip">
                <div class="login-remember">
                    <label for="remember"></label>
                    <input type="checkbox" id="remember" class="login-input" />로그인 상태 유지
                </div>
                <div class="span-div">
                    <span>IP 보안</span>
                </div>
            </div>

            <div class="login-form-wrapper passkey-login">
                <div class="passkey-login">
                    <button class="btn pass">패스키 로그인</button>
                    <button class="btn login">로그인</button>
                </div>
            </div>

            <div class="login-form-wrapper qrcode-once">
                <div class="qr-login">
                    <span>QR 코드 로그인</span>
                    |
                    <span>일회용 번호 로그인</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
