<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Flex 연습문제</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        nav ul {
            /* flex 속성은 부모요소에 작성 */
            display: flex;
            list-style: none;
            width: 300px;
            justify-content: space-between;
            border:1px solid red;
            margin: auto;
        }
        ul li {
            /* flex: 1은 자식요소에 작성*/
            flex:1;
            line-height:50px;
            border:1px solid blue;
            text-align: center;
        }
        ul li a {
            text-decoration: none;
            color: black;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
</body>
</html>
