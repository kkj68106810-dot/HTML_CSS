<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        *{
            margin: 0;
            padding: 0;            
        }
        .menu{
            width: 400px;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #ccc;
        }
        h1 {
            font-size: 20px;
            letter-spacing: 10px;
            margin-bottom: 10px;
            text-align: center;
        }
        li {
            list-style-type: none;
            text-transform: uppercase;
            border-bottom : 1px dashed gray;
        }
        .menu_li{
            padding: 10px 0;
        }
        span {
            float:right;
        }
    </style>
</head>
<body>
    <!--① 카페 메뉴판 페이지를 작성하시오.-->
    <!--② 박스(<div class="menu">)는 width: 400px, padding: 20px로 지정하시오.-->
    <!--③ 테두리는 1px solid #ccc, border-radius로 둥글게 처리하시오.-->
    <!--④ 제목 'Café Menu'는 <h1>, letter-spacing으로 자간을 넓게 지정하시오.-->
    <!--⑤ 메뉴 항목은 <ul><li>로 작성하고, text-transform: uppercase 적용하시오.-->
    <!--⑥ 가격은 <span>으로 오른쪽 정렬되도록 작성하시오.-->
    <!--⑦ CSS는 <head> 안에 작성하시오.-->
    <!--⑧ 파일명은 Example_13.html로 작성하시오.-->
    <div class="menu">
        <h1>Café Menu</h1>
        <ul>
            <li class="menu_li">AMERICANO<span>$3.50</span></li>
        </ul>
        <ul>
            <li class="menu_li">LATTE<span>$4.00</span></li>
        </ul>
        <ul>
            <li class="menu_li">CAPPUCCINO<span>$4.20</span></li>
        </ul>
    </div>

</body>
</html>
