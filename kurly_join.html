<!DOCTYPE html>
<html lang='ko'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>마켓컬리 회원가입</title>    
    <link rel="stylesheet" href="styleCss/kurly_join.css">
</head>
<body>    
    <h2 class="h2">회원가입</h2>
    <br />
    <br />
    <div class="require_input"><span class="astric">*</span>필수입력사항</div>
    <form action="#" method="get">
    <ul>
        <li>
            <label>아이디<input type="text" class="label_input" /></label>
        </li>
        <li>
            <label>비밀번호<input type="password" class="label_input" /></label>
        </li>
        <li>
            <label>비밀번호 확인<input type="password" class="label_input" /></label>
        </li>
        <li>
            <label>이름<input input="text" class="label_input" /></label>
        </li>
        <li>
            <label>이메일<input type="text" class="label_input" /></label>
        </li>
        <li>
            <label>휴대폰<input type="text" class="label_input" /></label>
        </li>
        <li>
            <label>주소<button type="submit" /></label>
        </li>
        <li>
            <label>성별
                <input type="radio" name="gender" />남자
                <input type="radio" name="gender" />여자
                <input type="radio" name="gender" />선택안함
            </label>
        </li>
        <li>
            <label>생년월일<button type="submit" /></label>
        </li>
        <li>
            <label>추가입력 사항
                <input type="radio" /> 친구초대 추천인 아이디
            </label>
        </li>

        <!-- 선긋기 -->
    </ul>
    </form>
</body>
</html>
